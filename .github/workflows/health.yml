name: Weekly song health check

on:
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC (09:11 IST)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run health
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Open or update the "Broken songs" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s health-report.md ] || { echo "Nothing broken."; exit 0; }
          num=$(gh issue list --state open --search "Broken songs on the radio in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file health-report.md;
          else gh issue create --title "Broken songs on the radio" --body-file health-report.md; fi
