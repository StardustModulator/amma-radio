name: Radio — refresh, build & deploy

on:
  schedule:
    - cron: '17 * * * *' # hourly at :17
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_crawl:
        description: 'Re-crawl every upload on every channel'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radio
  cancel-in-progress: false

jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint, typecheck & unit tests (skipped on the hourly cron)
        if: github.event_name != 'schedule'
        run: npm run lint && npm run typecheck && npm test

      - name: Install yt-dlp (keyless channel listing; only used when YOUTUBE_API_KEY is not set)
        if: env.YOUTUBE_API_KEY == ''
        run: pipx install yt-dlp || python3 -m pip install --user --break-system-packages yt-dlp
        continue-on-error: true

      - name: Refresh playlist + schedules
        run: npm run refresh
        env:
          FULL_CRAWL: ${{ inputs.full_crawl && '1' || '0' }}

      - name: Commit data if changed
        run: |
          git config user.name "radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "chore(data): refresh $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || true
          done
          echo "::warning::Could not push data (will retry next run)"

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.PAGES_BASE || '/amma-radio/' }}

      - name: Make sure no API key leaked into the site
        run: '! grep -r "AIza" dist'

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
